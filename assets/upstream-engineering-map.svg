<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="438" viewBox="0 0 1200 438" role="img" aria-labelledby="title desc">
  <title id="title">ThomsJack upstream engineering map</title>
  <desc id="desc">All public upstream projects contributed to by ThomsJack, categorized by engineering role with live pull request and star telemetry.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFFFF"/>
      <stop offset=".55" stop-color="#F5FBFC"/>
      <stop offset="1" stop-color="#EBF7FA"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63C6A7"/>
      <stop offset=".5" stop-color="#2A9DB2"/>
      <stop offset="1" stop-color="#5D86B3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#397E91" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1200" height="438" rx="22" fill="url(#canvas)"/>
  <rect x="1" y="1" width="1198" height="436" rx="21" fill="none" stroke="#B9DCE6" stroke-width="2"/>
  <rect x="32" y="34" width="5" height="370" rx="2.5" fill="url(#rail)"/>
